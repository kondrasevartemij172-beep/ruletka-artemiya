<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рулетка Артемия">
<meta name="theme-color" content="#17122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#17122b; --panel:#241c42; --line:#3a2f66; --ink:#fff6ee; --dim:#a79fcf; --accent:#ffe66d; --hot:#ff5d73;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; -webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif; font-weight:500;
  display:flex; flex-direction:column; align-items:center; padding:18px 16px 36px;
}
h1{
  font-family:'Unbounded','Arial Black',sans-serif; font-weight:900; font-size:clamp(24px,7vw,38px);
  margin:4px 0 18px; text-align:center; line-height:1.1;
}
.stage{position:relative; width:min(100%,420px); aspect-ratio:1}
canvas{width:100%; height:100%; display:block}
.pointer{
  position:absolute; left:50%; top:-6px; width:34px; height:44px; transform:translateX(-50%);
  background:var(--ink); clip-path:polygon(0 0,100% 0,50% 100%); z-index:2;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
}
.hub{
  position:absolute; left:50%; top:50%; width:24%; aspect-ratio:1; transform:translate(-50%,-50%);
  border-radius:50%; border:0; background:var(--accent); color:#241800; cursor:pointer;
  font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(11px,3.4vw,15px); z-index:2;
  box-shadow:0 0 0 6px var(--bg),0 6px 0 6px rgba(0,0,0,.3);
}
.hub:active{transform:translate(-50%,-48%)}
.hub:disabled{opacity:.7}
:focus-visible{outline:3px solid #fff; outline-offset:3px}

.add{display:flex; gap:8px; width:min(100%,420px); margin:28px 0 14px}
.add input{
  flex:1; min-width:0; font:inherit; font-size:17px; color:var(--ink); background:var(--panel);
  border:2px solid var(--line); border-radius:12px; padding:13px 14px;
}
.add input::placeholder{color:var(--dim)}
.add button{
  font:inherit; font-weight:700; font-size:17px; border:0; border-radius:12px; padding:0 20px;
  background:var(--hot); color:#fff; cursor:pointer;
}
.list{display:flex; flex-wrap:wrap; gap:8px; width:min(100%,420px); list-style:none; padding:0; margin:0}
.list li{
  display:flex; align-items:center; gap:6px; background:var(--panel); border-left:6px solid var(--c);
  border-radius:10px; padding:8px 6px 8px 12px; font-size:15px; max-width:100%;
}
.list span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px}
.list button{background:none; border:0; color:var(--dim); font-size:20px; line-height:1; cursor:pointer; padding:2px 8px}
.hint{color:var(--dim); font-size:14px; margin-top:12px; width:min(100%,420px); text-align:center; min-height:1.3em}
.tools{display:flex; gap:10px; margin-top:10px}
.tools button{font:inherit; font-size:14px; color:var(--dim); background:none; border:1.5px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer}

.modal{
  position:fixed; inset:0; background:rgba(10,6,24,.82); display:none; align-items:center; justify-content:center; padding:20px; z-index:10;
}
.modal.show{display:flex}
.card{
  background:var(--panel); border-radius:20px; padding:28px 22px; width:min(100%,380px); text-align:center;
  border-top:10px solid var(--c,var(--accent));
}
.card small{color:var(--dim); font-size:15px}
.card h2{font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(24px,8vw,36px); margin:10px 0 22px; overflow-wrap:anywhere; line-height:1.15}
.card .row{display:flex; gap:10px; flex-direction:column}
.card button{font:inherit; font-weight:700; font-size:16px; border:0; border-radius:12px; padding:14px; cursor:pointer}
.again{background:var(--accent); color:#241800}
.remove{background:transparent; color:var(--ink); border:2px solid var(--line)!important}
</style>
</head>
<body>
<h1>Рулетка Артемия</h1>

<div class="stage">
  <div class="pointer"></div>
  <canvas id="wheel"></canvas>
  <button class="hub" id="spin">КРУТИ</button>
</div>

<form class="add" id="form" autocomplete="off">
  <input id="inp" maxlength="40" placeholder="Кого или что добавить?" enterkeyhint="done" aria-label="Новый вариант">
  <button type="submit" aria-label="Добавить">+</button>
</form>
<ul class="list" id="list"></ul>
<div class="hint" id="hint"></div>
<div class="tools"><button id="clear">Очистить всё</button></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <small>Колесо выбрало</small>
    <h2 id="winner"></h2>
    <div class="row">
      <button class="again" id="again">Крутить ещё</button>
      <button class="remove" id="rm">Убрать из колеса</button>
    </div>
  </div>
</div>

<script>
const COLORS=["#ff5d73","#ffb347","#ffe66d","#5ee6a8","#4cc9f0","#7b6cff","#ff8fd8","#c8f560"];
let items=["Артемий","Макс","Дима","Саня"], theta=0, busy=false, win=-1;
try{ const s=JSON.parse(localStorage.getItem("ra-items")||"null"); if(Array.isArray(s)&&s.length) items=s; }catch(e){}
const $=id=>document.getElementById(id);
const cv=$("wheel"), ctx=cv.getContext("2d");
const col=i=>COLORS[i%COLORS.length];
const save=()=>{ try{ localStorage.setItem("ra-items",JSON.stringify(items)); }catch(e){} };

function size(){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); draw();
}
function draw(){
  const W=cv.width, R=W/2-6*(window.devicePixelRatio||1), c=W/2;
  ctx.clearRect(0,0,W,W);
  const n=items.length;
  if(!n){
    ctx.fillStyle="#241c42"; ctx.beginPath(); ctx.arc(c,c,R,0,7); ctx.fill();
    ctx.fillStyle="#a79fcf"; ctx.textAlign="center"; ctx.font="700 "+W/20+"px Manrope,sans-serif";
    ctx.fillText("Добавь варианты",c,c+W/60); return;
  }
  const seg=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const a=theta+i*seg;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a,a+seg); ctx.closePath();
    ctx.fillStyle=col(i); ctx.fill();
    ctx.lineWidth=W/150; ctx.strokeStyle="#17122b"; ctx.stroke();
    ctx.save(); ctx.translate(c,c); ctx.rotate(a+seg/2);
    ctx.fillStyle="#1a1230"; ctx.textAlign="right"; ctx.textBaseline="middle";
    const fs=Math.max(W/26,Math.min(W/14,R*seg*0.55));
    ctx.font="700 "+fs+"px Manrope,sans-serif";
    let t=items[i], max=R*0.62;
    while(ctx.measureText(t).width>max&&t.length>2) t=t.slice(0,-2)+"…";
    ctx.fillText(t,R-W/22,0); ctx.restore();
  }
}
function renderList(){
  $("list").innerHTML="";
  items.forEach((t,i)=>{
    const li=document.createElement("li"); li.style.setProperty("--c",col(i));
    const s=document.createElement("span"); s.textContent=t;
    const b=document.createElement("button"); b.textContent="×"; b.setAttribute("aria-label","Убрать "+t);
    b.onclick=()=>{ if(busy) return; items.splice(i,1); change(); };
    li.append(s,b); $("list").append(li);
  });
  $("hint").textContent = items.length<2 ? "Нужно минимум два варианта, чтобы крутить." : "Вариантов: "+items.length+". Жми «КРУТИ».";
  $("spin").disabled = items.length<2;
}
function change(){ save(); renderList(); draw(); }

$("form").onsubmit=e=>{
  e.preventDefault(); const v=$("inp").value.trim();
  if(!v||busy) return;
  if(items.length>=24){ $("hint").textContent="Максимум 24 варианта."; return; }
  items.push(v); $("inp").value=""; change();
};
$("clear").onclick=()=>{ if(busy) return; items=[]; change(); };

function spin(){
  if(busy||items.length<2) return; busy=true; $("spin").disabled=true;
  const start=theta, extra=(6+Math.random()*3)*2*Math.PI+Math.random()*2*Math.PI;
  const dur=matchMedia("(prefers-reduced-motion: reduce)").matches?300:5000, t0=performance.now();
  (function f(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4);
    theta=start+extra*e; draw();
    if(p<1) requestAnimationFrame(f); else finish();
  })(t0);
}
function finish(){
  const n=items.length, seg=2*Math.PI/n;
  let ang=((-Math.PI/2-theta)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  win=Math.min(n-1,Math.floor(ang/seg));
  $("winner").textContent=items[win];
  $("card").style.setProperty("--c",col(win));
  $("modal").classList.add("show");
  try{ navigator.vibrate&&navigator.vibrate(200); }catch(e){}
  busy=false; renderList();
}
$("spin").onclick=spin;
$("again").onclick=()=>{ $("modal").classList.remove("show"); spin(); };
$("rm").onclick=()=>{ $("modal").classList.remove("show"); if(win>-1){ items.splice(win,1); win=-1; change(); } };
$("modal").onclick=e=>{ if(e.target.id==="modal") $("modal").classList.remove("show"); };

addEventListener("resize",size);
renderList(); size();
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
if(document.fonts) document.fonts.ready.then(draw);
</script>
</body>
